AWSTemplateFormatVersion: '2010-09-09'
Description: Team Alpha Chatbot - Bedrock Agent with Knowledge Base, Aurora pgvector, Guardrails

Parameters:
  ProjectName:
    Type: String
    Default: TeamAlpha
    Description: Prefix for all resource names

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  AuroraMinCapacity:
    Type: Number
    Default: 0.5
    Description: Aurora Serverless v2 minimum ACUs

  AuroraMaxCapacity:
    Type: Number
    Default: 2
    Description: Aurora Serverless v2 maximum ACUs

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: Inference profile for the Bedrock Agent

  EmbeddingModelArn:
    Type: String
    Default: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
    Description: Embedding model ARN for Knowledge Base

  LambdaQueryS3Key:
    Type: String
    Default: lambda/query.zip
    Description: S3 key for query Lambda deployment package

  LambdaUploadS3Key:
    Type: String
    Default: lambda/upload.zip
    Description: S3 key for upload Lambda deployment package

  DocsBucketName:
    Type: String
    Description: Name of the pre-created S3 bucket for documents and Lambda code

Resources:

  # ============================================================
  # VPC — Required for Aurora Serverless v2
  # ============================================================

  ChatbotVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ChatbotVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ChatbotVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-2

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ChatbotVPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-rt

  PrivateSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  AuroraSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora Serverless v2 security group
      VpcId: !Ref ChatbotVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-aurora-sg

  # ============================================================
  # S3 Buckets
  # ============================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub team-alpha-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

  # ============================================================
  # Aurora Serverless v2 (pgvector)
  # ============================================================

  AuroraSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub TeamAlpha-aurora-${Environment}
      GenerateSecretString:
        SecretStringTemplate: '{"username": "dbadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Aurora cluster
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub ${ProjectName}-vector-cluster
      Engine: aurora-postgresql
      EngineVersion: '15.8'
      MasterUsername: !Sub '{{resolve:secretsmanager:${AuroraSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${AuroraSecret}:SecretString:password}}'
      DatabaseName: vectordb
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref AuroraSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref AuroraMinCapacity
        MaxCapacity: !Ref AuroraMaxCapacity
      EnableHttpEndpoint: true
      StorageEncrypted: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # Custom Resource — Initialize pgvector + table in Aurora
  # ============================================================

  InitDBRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TeamAlpha-InitDB-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RDSDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AuroraSecret

  InitDBFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuroraInstance
    Properties:
      FunctionName: !Sub TeamAlpha-initdb-${Environment}
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt InitDBRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              rds = boto3.client('rds-data')
              cluster_arn = event['ResourceProperties']['ClusterArn']
              secret_arn = event['ResourceProperties']['SecretArn']
              database = event['ResourceProperties']['Database']
              table_name = event['ResourceProperties']['TableName']

              try:
                  # Wait a moment for cluster to be fully ready
                  time.sleep(10)

                  # Enable pgvector extension
                  rds.execute_statement(
                      resourceArn=cluster_arn,
                      secretArn=secret_arn,
                      database=database,
                      sql='CREATE EXTENSION IF NOT EXISTS vector;'
                  )

                  # Create the table for Bedrock KB
                  rds.execute_statement(
                      resourceArn=cluster_arn,
                      secretArn=secret_arn,
                      database=database,
                      sql=f'''
                          CREATE TABLE IF NOT EXISTS {table_name} (
                              id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                              embedding vector(1024),
                              chunks TEXT,
                              metadata JSON
                          );
                      '''
                  )

                  # Create index for vector search
                  rds.execute_statement(
                      resourceArn=cluster_arn,
                      secretArn=secret_arn,
                      database=database,
                      sql=f'''
                          CREATE INDEX IF NOT EXISTS {table_name}_embedding_idx
                          ON {table_name}
                          USING hnsw (embedding vector_cosine_ops);
                      '''
                  )

                  # Create text search index on chunks (required by Bedrock)
                  rds.execute_statement(
                      resourceArn=cluster_arn,
                      secretArn=secret_arn,
                      database=database,
                      sql=f'''
                          CREATE INDEX IF NOT EXISTS {table_name}_chunks_idx
                          ON {table_name}
                          USING gin (to_tsvector('simple', chunks));
                      '''
                  )

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Message': 'DB initialized'})
              except Exception as e:
                  print(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  InitDB:
    Type: Custom::InitDB
    DependsOn: AuroraInstance
    Properties:
      ServiceToken: !GetAtt InitDBFunction.Arn
      ClusterArn: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}
      SecretArn: !Ref AuroraSecret
      Database: vectordb
      TableName: bedrock_kb

  # ============================================================
  # IAM Roles — Bedrock KB, Agent, Lambdas
  # ============================================================

  BedrockKBRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TeamAlpha-BedrockKB-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockKBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${DocsBucketName}
                  - !Sub arn:aws:s3:::${DocsBucketName}/*
              - Sid: EmbeddingModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Ref EmbeddingModelArn
              - Sid: AuroraAccess
                Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                  - rds:DescribeDBClusters
                Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}
              - Sid: SecretsAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AuroraSecret

  BedrockAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TeamAlpha-BedrockAgent-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-20250514-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-20250514-v1:0
                  - arn:aws:bedrock:us-east-1::foundation-model/*
              - Sid: RetrieveFromKB
                Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
              - Sid: ApplyGuardrail
                Effect: Allow
                Action:
                  - bedrock:ApplyGuardrail
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*

  QueryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TeamAlpha-Lambda-QueryRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeAgent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*/*

  UploadFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub TeamAlpha-Lambda-UploadRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UploadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Upload
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${DocsBucketName}/*
              - Sid: S3Presign
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::${DocsBucketName}/*
              - Sid: KBSync
                Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:GetIngestionJob
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*

  # ============================================================
  # Bedrock Knowledge Base
  # ============================================================

  TeamAlphaKB:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn:
      - InitDB
    Properties:
      Name: !Sub ${ProjectName}-kb-${Environment}
      RoleArn: !GetAtt BedrockKBRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Ref EmbeddingModelArn
      StorageConfiguration:
        Type: RDS
        RdsConfiguration:
          ResourceArn: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}
          CredentialsSecretArn: !Ref AuroraSecret
          DatabaseName: vectordb
          TableName: bedrock_kb
          FieldMapping:
            PrimaryKeyField: id
            VectorField: embedding
            TextField: chunks
            MetadataField: metadata

  KBS3DataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref TeamAlphaKB
      Name: !Sub ${ProjectName}-s3-source
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !Sub arn:aws:s3:::${DocsBucketName}
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 300
            OverlapPercentage: 20

  # ============================================================
  # Bedrock Guardrail
  # ============================================================

  TeamAlphaGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub ${ProjectName}-guardrail-${Environment}
      BlockedInputMessaging: "Sorry, I can't process that request. Please ask questions related to Team Alpha's documentation."
      BlockedOutputsMessaging: "Sorry, I can't provide that information. Please ask questions related to Team Alpha's documentation."
      ContentPolicyConfig:
        FiltersConfig:
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      TopicPolicyConfig:
        TopicsConfig:
          - Name: OffTopic
            Definition: "Any questions not related to Team Alpha's services, documentation, processes, or technical information."
            Type: DENY
            Examples:
              - "Write me a poem"
              - "What's the weather today"
              - "Help me with my homework"
              - "Tell me a joke"
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: US_SOCIAL_SECURITY_NUMBER
            Action: ANONYMIZE
          - Type: CREDIT_DEBIT_CARD_NUMBER
            Action: ANONYMIZE
          - Type: AWS_ACCESS_KEY
            Action: BLOCK
          - Type: AWS_SECRET_KEY
            Action: BLOCK

  TeamAlphaGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !Ref TeamAlphaGuardrail

  # ============================================================
  # Bedrock Agent
  # ============================================================

  TeamAlphaAgent:
    Type: AWS::Bedrock::Agent
    DependsOn:
      - TeamAlphaKB
      - TeamAlphaGuardrailVersion
    Properties:
      AgentName: !Sub ${ProjectName}-agent-${Environment}
      AgentResourceRoleArn: !GetAtt BedrockAgentRole.Arn
      FoundationModel: !Ref BedrockModelId
      IdleSessionTTLInSeconds: 1800
      Instruction: |
        You are Team Alpha's internal assistant. You help team members find information from Team Alpha's documentation.

        Rules:
        - Answer ONLY using information from the knowledge base
        - If the answer is not in the docs, say "I don't have that information in Team Alpha's documentation"
        - Always cite which document the answer came from
        - Ask clarifying questions if the user's question is ambiguous
        - Be concise but thorough
        - Format responses with clear headings and bullet points when appropriate
      GuardrailConfiguration:
        GuardrailIdentifier: !Ref TeamAlphaGuardrail
        GuardrailVersion: !GetAtt TeamAlphaGuardrailVersion.Version
      KnowledgeBases:
        - KnowledgeBaseId: !Ref TeamAlphaKB
          Description: "Team Alpha's internal documentation including architecture, processes, runbooks, and onboarding guides"
          KnowledgeBaseState: ENABLED

  TeamAlphaAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Properties:
      AgentId: !GetAtt TeamAlphaAgent.AgentId
      AgentAliasName: live

  # ============================================================
  # Lambda Functions
  # ============================================================

  QueryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub TeamAlpha-query-${Environment}
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt QueryFunctionRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        S3Bucket: !Ref DocsBucketName
        S3Key: !Ref LambdaQueryS3Key
      Environment:
        Variables:
          AGENT_ID: !GetAtt TeamAlphaAgent.AgentId
          AGENT_ALIAS_ID: !GetAtt TeamAlphaAgentAlias.AgentAliasId

  UploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub TeamAlpha-upload-${Environment}
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt UploadFunctionRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref DocsBucketName
        S3Key: !Ref LambdaUploadS3Key
      Environment:
        Variables:
          DOCS_BUCKET: !Ref DocsBucketName
          KNOWLEDGE_BASE_ID: !Ref TeamAlphaKB
          DATA_SOURCE_ID: !GetAtt KBS3DataSource.DataSourceId

  # ============================================================
  # API Gateway
  # ============================================================

  ChatbotApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${ProjectName}-api-${Environment}
      Description: Team Alpha Chatbot API

  AskResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ChatbotApi
      ParentId: !GetAtt ChatbotApi.RootResourceId
      PathPart: ask

  AskMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ChatbotApi
      ResourceId: !Ref AskResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QueryFunction.Arn}/invocations

  AskOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ChatbotApi
      ResourceId: !Ref AskResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  UploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ChatbotApi
      ParentId: !GetAtt ChatbotApi.RootResourceId
      PathPart: upload

  UploadMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ChatbotApi
      ResourceId: !Ref UploadResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadFunction.Arn}/invocations

  UploadOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ChatbotApi
      ResourceId: !Ref UploadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - AskMethod
      - UploadMethod
      - AskOptionsMethod
      - UploadOptionsMethod
    Properties:
      RestApiId: !Ref ChatbotApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ChatbotApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Environment

  QueryFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QueryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatbotApi}/*/POST/ask

  UploadFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatbotApi}/*/POST/upload

  # ============================================================
  # CloudFront Distribution
  # ============================================================

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectName}-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

# ============================================================
# Outputs
# ============================================================

Outputs:
  CloudFrontURL:
    Description: Chat UI URL
    Value: !Sub https://${FrontendDistribution.DomainName}

  ApiURL:
    Description: API Gateway base URL
    Value: !Sub https://${ChatbotApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  DocsBucketName:
    Description: S3 bucket for uploading documents
    Value: !Ref DocsBucketName

  FrontendBucketName:
    Description: S3 bucket for frontend files
    Value: !Ref FrontendBucket

  KnowledgeBaseId:
    Description: Bedrock Knowledge Base ID
    Value: !Ref TeamAlphaKB

  DataSourceId:
    Description: Bedrock Data Source ID
    Value: !GetAtt KBS3DataSource.DataSourceId

  AgentId:
    Description: Bedrock Agent ID
    Value: !GetAtt TeamAlphaAgent.AgentId

  AgentAliasId:
    Description: Bedrock Agent Alias ID
    Value: !GetAtt TeamAlphaAgentAlias.AgentAliasId
